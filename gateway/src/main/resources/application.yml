server:
  port: 8080

spring:
  application:
    name: gateway

  # Redis backs the rate limiter's token buckets
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          # Verify tokens locally using auth-service's PUBLIC keys.
          # ES256 is detected automatically from the JWKS.
          jwk-set-uri: ${JWKS_URI:http://localhost:4000/api/auth/jwks}

  cloud:
    gateway:
      # Applied to every route: throttle by user (or IP) via Redis
      default-filters:
        - name: RequestRateLimiter
          args:
            key-resolver: "#{@userKeyResolver}"
            redis-rate-limiter.replenishRate: 10   # tokens added per second
            redis-rate-limiter.burstCapacity: 20    # bucket ceiling
            redis-rate-limiter.requestedTokens: 1

      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:4000}
          predicates:
            - Path=/api/auth/**

        # Pre-wired for Service 3 — will resolve once product-service is up
        - id: product-service
          uri: ${PRODUCT_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/products/**

        # Pre-wired for the agent orchestrator (SSE) — Service 6
        - id: agent-orchestrator
          uri: ${AGENT_SERVICE_URI:http://localhost:3001}
          predicates:
            - Path=/api/agent/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
